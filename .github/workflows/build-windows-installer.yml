name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pensive-mccarthy-4ko6ba
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name "ExtractZipRar" extractor_gui.py

      - name: Locate or install Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup -y --no-progress
            $found = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          "path=$found" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        shell: pwsh
        run: '& "${{ steps.iscc.outputs.path }}" installer\setup.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtractZipRarSetup
          path: dist_installer\ExtractZipRarSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer\ExtractZipRarSetup.exe
