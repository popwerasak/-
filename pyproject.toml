[project]
name = "thaijo-mcp"
version = "0.1.0"
description = "MCP server for searching research articles on ThaiJO (tci-thaijo.org)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "httpx>=0.27"]

[project.scripts]
thaijo-mcp = "thaijo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
