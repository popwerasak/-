name: ThaiRealtimeTranslate
options:
  bundleIdPrefix: com.popwerasak
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ThaiRealtimeTranslate:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "แอปนี้ต้องใช้ไมโครโฟน (รวมถึงไมค์ของ AirPods) เพื่อฟังเสียงพูดและแปลภาษาแบบเรียลไทม์"
        NSSpeechRecognitionUsageDescription: "แอปนี้ใช้การรู้จำเสียงพูดบนอุปกรณ์ (ทำงานออฟไลน์ได้) เพื่อแปลงเสียงพูดเป็นข้อความก่อนนำไปแปลภาษา"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popwerasak.ThaiRealtimeTranslate
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
